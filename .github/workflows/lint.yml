name: lint

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly sanity run (the old firmware-repo BPF-CHECK role).
    - cron: "0 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: sh -n on every tracked shell script
        run: sh scripts/check-scripts.sh

      - name: shellcheck -S warning
        run: |
          set -eu
          # OpenWrt shell (busybox ash + /etc/rc.common), not portable POSIX sh.
          # Excluded by design:
          #   SC2034  variables consumed by another script or by rc.common
          #   SC2096  the init-script shebang "#!/bin/sh /etc/rc.common"
          #   SC2120  helpers take optional args and are called both ways
          #   SC2155  "local x=$(...)" is the ash idiom used in ebpf-mwan
          #   SC2218  functions are defined for runtime dispatch
          #   SC3043  `local` itself (an ash extension)
          #   SC2154  uci-injected variables (config_load/option_get)
          #   SC1007  "CDPATH= cd ..." (deliberate empty-prefix assignment)
          #   SC2046  intentional word splitting: `set -- $(read_cpu)`
          #   SC2100  false positive on string values like `code=mode-off`
          #   SC2209  `interp=sh` holds a command name on purpose
          exclude='SC2034,SC2096,SC2120,SC2155,SC2218,SC3043,SC2154,SC1007,SC2046,SC2100,SC2209'
          list=$(mktemp)
          trap 'rm -f "$list"' EXIT HUP INT TERM
          git ls-files '*.sh' >>"$list"
          git ls-files | while IFS= read -r f; do
            case $f in
              *.sh) continue ;;
            esac
            [ -f "$f" ] || continue
            first=$(head -n 1 "$f" 2>/dev/null || true)
            case $first in
              '#!/bin/sh'*|'#!/usr/bin/env sh'*) printf '%s\n' "$f" >>"$list" ;;
            esac
          done
          LC_ALL=C sort -u -o "$list" "$list"
          count=$(wc -l <"$list" | tr -d ' ')
          echo "shellcheck $(shellcheck --version | sed -n 's/^version: //p') on $count files"
          tr '\n' '\0' <"$list" | xargs -0 -r shellcheck --severity=warning --exclude="$exclude"

  bpf:
    name: bpf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, llvm and headers
        run: |
          sudo apt-get update
          # gcc-multilib: -target bpf defines no __x86_64__, so glibc's
          # gnu/stubs.h takes the 32-bit branch and needs gnu/stubs-32.h.
          sudo apt-get install -y clang llvm gcc gcc-multilib libbpf-dev linux-libc-dev

      - name: Compile every bpf source for the BPF target
        run: |
          set -uo pipefail
          {
            multiarch=$(gcc -print-multiarch 2>/dev/null || echo x86_64-linux-gnu)
            git ls-files 'bpf/**/*.bpf.c' > /tmp/bpf-sources
            test -s /tmp/bpf-sources
            while IFS= read -r src; do
              dir=$(dirname "$src")
              out="/tmp/$(basename "$src" .c).o"
              echo "clang -target bpf: $src -> $out"
              clang -target bpf -O2 -g -DDPD_MODE_DEFAULT=1 \
                -D__KERNEL__ -D__BPF_TRACING__ \
                -I "$dir" -I /usr/include -I "/usr/include/$multiarch" \
                -c "$src" -o "$out"
            done < /tmp/bpf-sources
          } 2>&1 | tee /tmp/bpf.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            { echo '### bpf compile failed'; echo '```'; tail -60 /tmp/bpf.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

      - name: Core object has the classifier/l2 and classifier/l3 sections
        run: |
          set -eu
          obj=/tmp/dpd_fastpath.bpf.o
          test -f "$obj"
          llvm-objdump -h "$obj"
          for sec in classifier/l2 classifier/l3; do
            if ! llvm-objdump -h "$obj" | awk '{print $2}' | grep -Fxq "$sec"; then
              echo "missing section $sec in $obj"
              exit 1
            fi
          done

      - name: Compile dpdctl with -Wall -Werror
        run: |
          gcc -O2 -Wall -Werror -I bpf/core/src \
            -o /tmp/dpdctl bpf/core/src/dpdctl.c

  abi:
    name: abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ABI stamp, TC section names and counter names
        run: sh scripts/verify-abi.sh
