# Copyright (C) 2026 kwrum1
#
# sdk: build the shipped DPD packages as apk artifacts with the official
# ImmortalWrt SDK, without building a whole image.
#
# Why: the image pipeline takes ~90 minutes and only fails at the end. This job
# compiles exactly the four packages the firmware ships:
#
#   dpdfwd          flow manager (control plane)
#   dpd-fastpath    tc eBPF datapath + dpdctl
#   dpd-napi        NAPI/queue tuning scripts
#   luci-app-ebpf   LuCI pages + simple firewall
#
# The package definitions come from the firmware repository's `ebpf/` tree, so
# the artifacts are exactly what ships (and a broken package fails here in ~5
# minutes instead of inside an image build).
#
# Recipe notes (validated on an x86_64 SDK):
#   * packages must sit directly under package/ -- the build system only scans
#     package/<name>/Makefile, not nested directories;
#   * `make package/<name>/compile` resolves DEPENDS and would build the whole
#     kernel module set; `make -C package/<name> ... compile` builds only that
#     package;
#   * the BPF object is compiled with the host clang (CLANG=clang) and host
#     headers (DPD_BPF_INCLUDES=-I/usr/include), so no bpf-headers download and
#     no kernel tarball is pulled in.

name: sdk

on:
  workflow_dispatch:
  # Clean-then-build: auto-clean wipes the old apk artifacts and re-runs this.
  workflow_run:
    workflows: ["auto-clean"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/sdk.yml'
  schedule:
    # Backup weekly run (Monday 03:00 Asia/Shanghai); the daily path is
    # auto-clean -> workflow_run.
    - cron: 0 19 * * 0

permissions:
  contents: read

concurrency:
  group: sdk
  cancel-in-progress: false

env:
  FW_REPO: kwrum1/ebpf-honk-ImmortalWRT-CI
  SDK_BASE: https://downloads.immortalwrt.org/snapshots

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: targets/x86/64
          - name: aarch64
            target: targets/rockchip/armv8
    steps:
      - name: Checkout the package tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FW_REPO }}
          path: fw
          fetch-depth: 1

      # The firmware tree keeps only the Makefiles; the sources come from this
      # repository's arm branch. DPD_REF defaults to arm, pin it for a release.
      - name: Fetch DPD dataplane sources
        working-directory: fw
        run: sh Scripts/Fetch-DPD.sh

      - name: Install host tools
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install --no-install-recommends \
            clang llvm libbpf-dev libelf-dev pkg-config zstd

      - name: Fetch the SDK
        run: |
          set -euo pipefail
          index=$(curl -fsSL "$SDK_BASE/${{ matrix.target }}/")
          file=$(printf '%s' "$index" \
            | grep -oE 'href="[^"]*sdk[^"]*Linux-x86_64\.tar\.zst"' \
            | head -1 | cut -d'"' -f2)
          test -n "$file" || { echo "no SDK in $SDK_BASE/${{ matrix.target }}/" >&2; exit 1; }
          echo "sdk: $file"
          curl -fL --retry 5 --retry-all-errors -o sdk.tar.zst "$SDK_BASE/${{ matrix.target }}/$file"
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Copy the four packages
        run: |
          set -euo pipefail
          for p in dpdfwd router-dataplane dpd-napi luci-app-ebpf; do
            test -f "fw/ebpf/$p/Makefile"
            rm -rf "sdk/package/$p"
            cp -r "fw/ebpf/$p" "sdk/package/$p"
          done
          ls -d sdk/package/dpdfwd sdk/package/router-dataplane sdk/package/dpd-napi sdk/package/luci-app-ebpf

      - name: Build the packages
        run: |
          set -uo pipefail
          cd sdk
          if ! make defconfig >/tmp/defconfig.log 2>&1; then
            tail -40 /tmp/defconfig.log
            { echo '### defconfig failed'; echo '```'; tail -40 /tmp/defconfig.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A fresh SDK has no libc/libgcc metadata: package-pack.mk checks each
          # package's DT_NEEDED against the provides files of its implicit deps,
          # finds nothing, and refuses to create the apk. Seed the two SONAMEs.
          target=$(ls -d staging_dir/target-* 2>/dev/null | head -1)
          if [ -z "$target" ]; then
            make -C package/dpdfwd TOPDIR="$PWD" BUILD_SUBDIR=package/dpdfwd \
              BUILD_VARIANT= ALL_VARIANTS= CONFIG_PACKAGE_dpdfwd=m prepare >/dev/null 2>&1 || true
            target=$(ls -d staging_dir/target-* 2>/dev/null | head -1)
          fi
          echo "target dir: ${target:-none}"
          mkdir -p "$target/pkginfo"
          printf 'libc.so\nlibgcc_s.so.1\n' > "$target/pkginfo/libc.provides"
          printf 'libgcc_s.so.1\n' > "$target/pkginfo/libgcc.provides"
          # The package looks for bpf/bpf_helpers.h under $(STAGING_DIR)/usr/include,
          # which a bare SDK does not populate (libbpf is not built). Copy the
          # host's libbpf headers there instead of pointing -I at /usr/include,
          # which would hide the toolchain's asm/types.h.
          mkdir -p "$target/usr/include"
          cp -r /usr/include/bpf "$target/usr/include/"

          # The package is only built when it is enabled; defconfig does not
          # always select local packages, so pass the symbol on the command
          # line (it wins over .config). Signature is off: a fresh SDK has no
          # private-key.pem.
          fail=0
          while read -r dir name; do
            echo "::group::$name"
            if make -C "package/$dir" TOPDIR="$PWD" \
              BUILD_SUBDIR="package/$dir" BUILD_VARIANT= ALL_VARIANTS= \
              compile CONFIG_PACKAGE_"$name"=m CONFIG_SIGN_EACH_PACKAGE= \
              CLANG=clang BPF_DEPENDS= \
              > "/tmp/build-$name.log" 2>&1; then
              echo "ok: $name"
            else
              echo "::error::package $name failed"
              tail -80 "/tmp/build-$name.log"
              { echo "### $name failed"; echo '```'; tail -60 "/tmp/build-$name.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done <<'EOF'
          dpdfwd dpdfwd
          dpd-napi dpd-napi
          luci-app-ebpf luci-app-ebpf
          router-dataplane dpd-fastpath
          EOF
          exit "$fail"

      - name: Collect the apks
        run: |
          set -euo pipefail
          mkdir -p out
          find sdk/bin -name '*.apk' -exec cp -f {} out/ \;
          ls -l out/
          for p in dpdfwd dpd-fastpath dpd-napi luci-app-ebpf; do
            compgen -G "out/${p}-*.apk" >/dev/null \
              || { echo "!! missing apk: $p" >&2; exit 1; }
          done
          # apk v3 is not a gzip tar, so there is no portable "list members"
          # here; the package build itself fails if dpd_fastpath.bpf.o or
          # dpdctl were missing from the install list.

      # The apk is what actually ships, and until now nothing ever looked
      # inside it: a build that silently packaged a stale object would still be
      # green. These checks read the *staged install tree* the package was
      # built from, i.e. exactly the file list that went into the apk.
      - name: Assert the packaged ABI matches the source
        run: |
          set -euo pipefail
          want=$(grep -oP '^#define DPD_ABI_VERSION\s+\K[0-9]+' \
                 fw/ebpf/router-dataplane/src/dpd_common.h)
          echo "source declares ABI=$want"

          stamp=$(find sdk/staging_dir sdk/build_dir -path '*/usr/lib/dpd/abi' \
                  2>/dev/null | head -1 || true)
          if [ -z "$stamp" ]; then
            echo "!! /usr/lib/dpd/abi was not installed into the package" >&2
            echo "!! the init script needs it to decide whether to drop pinned maps" >&2
            exit 1
          fi
          got=$(tr -d '[:space:]' < "$stamp")
          echo "packaged ABI=$got (from $stamp)"

          if [ "$got" != "$want" ]; then
            echo "!! packaged ABI ($got) != source ABI ($want)" >&2
            echo "!! the apk would install an object the userspace does not match" >&2
            exit 1
          fi

          # The object and the control binary must both be present, and the
          # object must have the sections the attach script asks for.
          obj=$(find sdk/staging_dir sdk/build_dir -name 'dpd_fastpath.bpf.o' \
                2>/dev/null | head -1 || true)
          [ -n "$obj" ] || { echo "!! dpd_fastpath.bpf.o not installed" >&2; exit 1; }
          echo "bpf.o: $obj ($(stat -c %s "$obj") bytes)"
          readelf -S "$obj" | grep -q 'classifier/l2' \
            || { echo "!! classifier/l2 section missing from the object" >&2; exit 1; }
          readelf -S "$obj" | grep -q 'classifier/egress' \
            || { echo "!! classifier/egress section missing from the object" >&2; exit 1; }

          find sdk/staging_dir -name 'dpdctl' -type f | head -1 | grep -q . \
            || { echo "!! dpdctl not installed" >&2; exit 1; }
          echo "packaged datapath: ok (abi=$got, sections present)"

      - name: Upload apks
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.name }}
          path: out/*.apk
          if-no-files-found: error
