# Copyright (C) 2026 kwrum1
#
# sdk: build the shipped DPD packages as apk artifacts with the official
# ImmortalWrt SDK, without building a whole image.
#
# Why: the image pipeline takes ~90 minutes and only fails at the end. This job
# compiles exactly the four packages the firmware ships:
#
#   dpdfwd          flow manager (control plane)
#   dpd-fastpath    tc eBPF datapath + dpdctl
#   dpd-napi        NAPI/queue tuning scripts
#   luci-app-ebpf   LuCI pages + simple firewall
#
# The package definitions come from the firmware repository's `ebpf/` tree, so
# the artifacts are exactly what ships (and a broken package fails here in ~5
# minutes instead of inside an image build).
#
# Recipe notes (validated on an x86_64 SDK):
#   * packages must sit directly under package/ -- the build system only scans
#     package/<name>/Makefile, not nested directories;
#   * `make package/<name>/compile` resolves DEPENDS and would build the whole
#     kernel module set; `make -C package/<name> ... compile` builds only that
#     package;
#   * the BPF object is compiled with the host clang (CLANG=clang) and host
#     headers (DPD_BPF_INCLUDES=-I/usr/include), so no bpf-headers download and
#     no kernel tarball is pulled in.

name: sdk

on:
  workflow_dispatch:
  # Clean-then-build: auto-clean wipes the old apk artifacts and re-runs this.
  workflow_run:
    workflows: ["auto-clean"]
    types: [completed]
  push:
    paths:
      - '.github/workflows/sdk.yml'
  schedule:
    # Backup weekly run (Monday 03:00 Asia/Shanghai); the daily path is
    # auto-clean -> workflow_run.
    - cron: 0 19 * * 0

permissions:
  contents: read

concurrency:
  group: sdk
  cancel-in-progress: false

env:
  FW_REPO: kwrum1/ebpf-honk-ImmortalWRT-CI
  SDK_BASE: https://downloads.immortalwrt.org/snapshots

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: targets/x86/64
          - name: aarch64
            target: targets/rockchip/armv8
    steps:
      - name: Checkout the package tree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FW_REPO }}
          path: fw
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install --no-install-recommends \
            clang llvm libbpf-dev libelf-dev pkg-config zstd

      - name: Fetch the SDK
        run: |
          set -euo pipefail
          index=$(curl -fsSL "$SDK_BASE/${{ matrix.target }}/")
          file=$(printf '%s' "$index" \
            | grep -oE 'href="[^"]*sdk[^"]*Linux-x86_64\.tar\.zst"' \
            | head -1 | cut -d'"' -f2)
          test -n "$file" || { echo "no SDK in $SDK_BASE/${{ matrix.target }}/" >&2; exit 1; }
          echo "sdk: $file"
          curl -fL --retry 5 --retry-all-errors -o sdk.tar.zst "$SDK_BASE/${{ matrix.target }}/$file"
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Copy the four packages
        run: |
          set -euo pipefail
          for p in dpdfwd router-dataplane dpd-napi luci-app-ebpf; do
            test -f "fw/ebpf/$p/Makefile"
            rm -rf "sdk/package/$p"
            cp -r "fw/ebpf/$p" "sdk/package/$p"
          done
          ls -d sdk/package/dpdfwd sdk/package/router-dataplane sdk/package/dpd-napi sdk/package/luci-app-ebpf

      - name: Build the packages
        run: |
          set -euo pipefail
          cd sdk
          make defconfig >/dev/null
          # A fresh SDK has no libc/libgcc metadata: package-pack.mk checks each
          # package's DT_NEEDED against the provides files of its implicit deps,
          # finds nothing, and refuses to create the apk. Seed the two SONAMEs.
          pkginfo=$(echo staging_dir/target-*/pkginfo)
          mkdir -p "$pkginfo"
          printf 'libc.so\nlibgcc_s.so.1\n' > "$pkginfo/libc.provides"
          printf 'libgcc_s.so.1\n' > "$pkginfo/libgcc.provides"
          for p in dpdfwd dpd-napi luci-app-ebpf router-dataplane; do
            echo "== $p"
            make -C "package/$p" TOPDIR="$PWD" \
              BUILD_SUBDIR="package/$p" BUILD_VARIANT= ALL_VARIANTS= \
              compile CONFIG_SIGN_EACH_PACKAGE= \
              CLANG=clang BPF_DEPENDS= DPD_BPF_INCLUDES=-I/usr/include
          done

      - name: Verify the apks
        run: |
          set -euo pipefail
          cd sdk
          ls -l bin/packages/*/base/
          for p in dpdfwd dpd-fastpath dpd-napi luci-app-ebpf; do
            compgen -G "bin/packages/*/base/${p}-*.apk" >/dev/null \
              || { echo "!! missing apk: $p" >&2; exit 1; }
          done
          # The datapath package must actually contain the compiled object.
          apk=$(ls bin/packages/*/base/dpd-fastpath-*.apk)
          tar -tzf "$apk" 2>/dev/null | grep -E 'lib/bpf/dpd_fastpath\.bpf\.o|usr/sbin/dpdctl' \
            || { echo "!! $apk has no dpd_fastpath.bpf.o / dpdctl" >&2; exit 1; }

      - name: Upload apks
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.name }}
          path: sdk/bin/packages/*/base/*.apk
          if-no-files-found: error
